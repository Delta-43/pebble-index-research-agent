# Pebble Index Research Agent — server-side stack
#
# Assumes `minio` and `n8n` already exist elsewhere on this server/network. Add them here (or extend
# your existing compose project with this file via `docker compose -f existing.yml -f docker-compose.yml`)
# once their exact service names/networks are known.
#
# STATUS: foundation + vault mirror + searxng validated (spike-livesync-s3, spike-mcp-bridge,
# server-base-setup, vault-mirror-service, searxng-service) — every service below has a real, tested
# config. Not yet deployed together as a single up-to-date stack on home_server (see docs/SETUP.md) —
# n8n-workflow-trigger and n8n-workflow-agent are still pending.
#
# Networking (validated server-base-setup, 2026-08-25): `n8n_n8n_internal` is n8n's own existing Docker
# network (external to this project) — mcp-obsidian and mcp-searxng join it so n8n's MCP Client Tool
# node can reach their SSE endpoints (this exact reachability was tested in spike-mcp-bridge from the
# real running n8n container). `pebble-agent-internal` is a new network dedicated to this project, used
# to keep `searxng` reachable only by `mcp-searxng` (not directly by n8n or the host) — `mcp-searxng`
# bridges both networks.

services:
  # Keeps a plain-Markdown mirror of the Obsidian vault on disk, synced against the same MinIO/S3
  # remote (Journal Sync) used by the phone's Self-hosted LiveSync plugin.
  #
  # VALIDATED (spike-livesync-s3): this builds and runs correctly. `settings.json` must exist and be
  # already configured (via `init-settings` + `setup <Setup URI>` + a one-time `unlock-remote` for a
  # new device) before this service starts — see docs/SETUP.md Phase 1 for the exact bootstrap
  # sequence. That bootstrap is not yet automated here (still a manual one-time step, since it needs
  # the Setup URI's passphrase entered interactively).
  #
  # VALIDATED (vault-mirror-service): deployed as a real, persistent bind-mounted service (not the
  # spike's scratch volumes) — `${VAULT_MIRROR_DATA_PATH}` and `${VAULT_MIRROR_PATH}` are host
  # directories (see docker/.env), so other tools (mcp-obsidian, and later n8n's Local File Trigger,
  # which isn't part of this compose project) can all point at the exact same host path. The vault
  # directory needs a pre-existing `.obsidian/` folder (Journal Sync doesn't replicate it, and
  # `obsidian-mcp` refuses a vault without one) — create it once on the host:
  # `mkdir -p "$VAULT_MIRROR_PATH/.obsidian"`.
  livesync-cli:
    build:
      context: https://github.com/vrtmrz/obsidian-livesync.git
      dockerfile: src/apps/cli/Dockerfile
    container_name: livesync-cli
    restart: unless-stopped
    command: ["--settings", "/data/livesync-settings.json", "--vault", "/vault", "daemon"]
    env_file: .env
    volumes:
      - ${VAULT_MIRROR_DATA_PATH:-./vault-mirror-data}:/data
      - ${VAULT_MIRROR_PATH:-./vault-mirror-vault}:/vault
    # NOTE: the official image writes files as root (no non-root user configured) — anything else
    # (mcp-obsidian, n8n Local File Trigger) reading/writing the vault mirror needs to tolerate that.

  # Self-hosted meta search engine backing the research MCP tool.
  #
  # VALIDATED (searxng-service): deliberately NOT reusing the already-running `n8n-searxng-1` — turns
  # out it's an internal component of n8n's own `instance-ai` sandbox feature (wired to
  # sandbox-api/sandbox-runner-1, a privileged Docker-in-Docker container), not a general-purpose
  # instance. Confirmed on home_server it sits stopped whenever that sandbox is idle, independent of
  # n8n's own uptime — an unsuitable, undocumented dependency for a standalone published stack. This
  # dedicated instance stays fully decoupled instead. `docker/searxng/settings.yml.example` is the
  # committed template (JSON format, needed by mcp-searxng); copy it to `settings.yml` (gitignored,
  # holds a real generated secret_key — see docs/SETUP.md Phase 2) before first deploy.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - pebble-agent-internal
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Bridges the stdio obsidian-mcp server to an SSE endpoint n8n can call.
  #
  # VALIDATED (spike-mcp-bridge): built and tested against a real vault mirror + the real n8n container.
  # Uses the real `sparfenyuk/mcp-proxy` (Python) — NOT `npx -y mcp-proxy`, which resolves to an
  # unrelated npm package (see docs/TROUBLESHOOTING.md). The vault path needs a pre-existing (empty is
  # fine) `.obsidian/` directory, since Journal Sync doesn't replicate it — not yet automated here.
  mcp-obsidian:
    build: ./mcp-obsidian
    container_name: mcp-obsidian
    restart: unless-stopped
    networks:
      - n8n_n8n_internal
    volumes:
      - ${VAULT_MIRROR_PATH:-./vault-mirror-vault}:/vault
    ports:
      - "8801:8801"

  # Bridges the stdio mcp-searxng server to an SSE endpoint n8n can call.
  #
  # VALIDATED (spike-mcp-bridge): built and tested end-to-end (real live search results returned).
  # mcp-searxng is installed from git source, not PyPI (PyPI 0.1.0 is incompatible with current
  # SearXNG's JSON schema — see docs/TROUBLESHOOTING.md).
  mcp-searxng:
    build: ./mcp-searxng
    container_name: mcp-searxng
    restart: unless-stopped
    env_file: .env
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    networks:
      - n8n_n8n_internal
      - pebble-agent-internal
    depends_on:
      - searxng
    ports:
      - "8802:8802"

networks:
  # n8n's own existing network — external because this project doesn't own/manage n8n's compose stack.
  n8n_n8n_internal:
    external: true
  # Dedicated to this project: keeps `searxng` reachable only by `mcp-searxng`, not by n8n or the host.
  # external because docs/SETUP.md Phase 0.5 already creates it (`docker network create
  # pebble-agent-internal`) as a plain, unprefixed network name — without `external: true` here, Compose
  # instead creates and uses its own `<project-name>_pebble-agent-internal` (e.g. `docker_...` when this
  # compose file lives in a directory named `docker`), silently diverging from the network Phase 0.5 set
  # up and from every other doc/comment in this repo that references `pebble-agent-internal` by name.
  pebble-agent-internal:
    external: true
