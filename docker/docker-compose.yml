# Pebble Index Research Agent — server-side stack
#
# Assumes `minio` and `n8n` already exist elsewhere on this server/network. Add them here (or extend
# your existing compose project with this file via `docker compose -f existing.yml -f docker-compose.yml`)
# once their exact service names/networks are known.
#
# STATUS: skeleton only — service configs below are placeholders pending the spikes described in
# docs/ARCHITECTURE.md. Do not deploy as-is.

services:
  # Keeps a plain-Markdown mirror of the Obsidian vault on disk, synced against the same MinIO/S3
  # remote (Journal Sync) used by the phone's Self-hosted LiveSync plugin.
  #
  # VALIDATED (spike-livesync-s3): this builds and runs correctly. `settings.json` must exist and be
  # already configured (via `init-settings` + `setup <Setup URI>` + a one-time `unlock-remote` for a
  # new device) before this service starts — see docs/SETUP.md Phase 1 for the exact bootstrap
  # sequence. That bootstrap is not yet automated here (still a manual one-time step, since it needs
  # the Setup URI's passphrase entered interactively); `vault-mirror-service` will wire it up properly
  # (e.g. an init container, or a documented `docker compose run` bootstrap command).
  livesync-cli:
    build:
      context: https://github.com/vrtmrz/obsidian-livesync.git
      dockerfile: src/apps/cli/Dockerfile
    container_name: livesync-cli
    restart: unless-stopped
    command: ["--settings", "/data/livesync-settings.json", "--vault", "/vault", "daemon"]
    volumes:
      - livesync_db:/data
      - vault_mirror:/vault
    # NOTE: the official image writes files as root (no non-root user configured) — anything else
    # (mcp-obsidian, n8n Local File Trigger) reading/writing `vault_mirror` needs to tolerate that.

  # Self-hosted meta search engine backing the research MCP tool.
  #
  # NOTE (spike-mcp-bridge): an existing n8n-searxng-1 container is already running on this server
  # (part of n8n's own sandbox stack) with JSON format already enabled and reachable only via the
  # internal n8n network — worth reusing instead of standing up a second instance; decide during
  # searxng-service.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - searxng_config:/etc/searxng
    # TODO: enable JSON format in settings.yml (`formats: [html, json]`) so mcp-searxng can query it.

  # Bridges the stdio obsidian-mcp server to an SSE endpoint n8n can call.
  #
  # VALIDATED (spike-mcp-bridge): built and tested against a real vault mirror + the real n8n container.
  # Uses the real `sparfenyuk/mcp-proxy` (Python) — NOT `npx -y mcp-proxy`, which resolves to an
  # unrelated npm package (see docs/TROUBLESHOOTING.md). The vault path needs a pre-existing (empty is
  # fine) `.obsidian/` directory, since Journal Sync doesn't replicate it — not yet automated here.
  mcp-obsidian:
    build: ./mcp-obsidian
    container_name: mcp-obsidian
    restart: unless-stopped
    volumes:
      - vault_mirror:/vault
    ports:
      - "8801:8801"

  # Bridges the stdio mcp-searxng server to an SSE endpoint n8n can call.
  #
  # VALIDATED (spike-mcp-bridge): built and tested end-to-end (real live search results returned).
  # mcp-searxng is installed from git source, not PyPI (PyPI 0.1.0 is incompatible with current
  # SearXNG's JSON schema — see docs/TROUBLESHOOTING.md).
  mcp-searxng:
    build: ./mcp-searxng
    container_name: mcp-searxng
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      - searxng
    ports:
      - "8802:8802"

volumes:
  livesync_db:
  vault_mirror:
  searxng_config:
