# Pebble Index Research Agent — server-side stack
#
# Assumes `minio` and `n8n` already exist elsewhere on this server/network — this file doesn't start
# them. See docs/SETUP.md for the full deployment walkthrough; this compose file is deployed
# standalone from the `docker/` directory (`docker compose up -d`), not merged into your n8n/minio
# compose project.
#
# STATUS: every service below is deployed and validated end-to-end on a real server, including a real
# note → trigger → web search → research note round trip. See docs/ARCHITECTURE.md and
# docs/TROUBLESHOOTING.md for the real findings and gotchas behind each service.
#
# Networking: n8n's own existing Docker network (external to this project, name set via
# N8N_NETWORK_NAME in .env — run `docker network ls` and find the one your n8n container is on, or
# `docker inspect <your-n8n-container> --format '{{json .NetworkSettings.Networks}}'`) is joined by
# mcp-obsidian and mcp-searxng so n8n's MCP Client Tool node can reach their SSE endpoints (this exact
# reachability was validated end-to-end against a real running n8n container — see docs/ARCHITECTURE.md).
# `pebble-agent-internal` is a new network dedicated to this project, used to keep `searxng` reachable
# only by `mcp-searxng` (not directly by n8n or the host) — `mcp-searxng` bridges both networks.

services:
  # Keeps a plain-Markdown mirror of the Obsidian vault on disk, synced against the same MinIO/S3
  # remote (Journal Sync) used by the phone's Self-hosted LiveSync plugin.
  #
  # VALIDATED (spike-livesync-s3): this builds and runs correctly. `settings.json` must exist and be
  # already configured (via `init-settings` + `setup <Setup URI>` + a one-time `unlock-remote` for a
  # new device) before this service starts — see docs/SETUP.md Phase 2 for the exact bootstrap
  # sequence. That bootstrap is not yet automated here (still a manual one-time step, since it needs
  # the Setup URI's passphrase entered interactively).
  #
  # VALIDATED (vault-mirror-service): deployed as a real, persistent bind-mounted service (not the
  # spike's scratch volumes) — `${VAULT_MIRROR_DATA_PATH}` and `${VAULT_MIRROR_PATH}` are host
  # directories (see docker/.env), so other tools (mcp-obsidian, and later n8n's Local File Trigger,
  # which isn't part of this compose project) can all point at the exact same host path. The vault
  # directory needs a pre-existing `.obsidian/` folder (Journal Sync doesn't replicate it, and
  # `obsidian-mcp` refuses a vault without one) — create it once on the host:
  # `mkdir -p "$VAULT_MIRROR_PATH/.obsidian"`.
  livesync-cli:
    build:
      context: https://github.com/vrtmrz/obsidian-livesync.git
      dockerfile: src/apps/cli/Dockerfile
    container_name: livesync-cli
    restart: unless-stopped
    command: ["--settings", "/data/livesync-settings.json", "--vault", "/vault", "daemon"]
    env_file: .env
    volumes:
      - ${VAULT_MIRROR_DATA_PATH:-./vault-mirror-data}:/data
      - ${VAULT_MIRROR_PATH:-./vault-mirror-vault}:/vault
    # NOTE: the official image writes files as root (no non-root user configured) — anything else
    # (mcp-obsidian, n8n Local File Trigger) reading/writing the vault mirror needs to tolerate that.

  # Self-hosted meta search engine backing the research MCP tool. This project runs its own dedicated
  # instance rather than trying to reuse one you might already have — during development, an existing
  # `n8n-searxng-1` was found running near n8n, but it turned out to be an internal component of n8n's
  # own `instance-ai` sandbox feature (only up while that sandbox is active, stopped otherwise), not a
  # general-purpose instance. If you also have an existing SearXNG nearby, verify what it's actually
  # for before reusing it — see docs/ARCHITECTURE.md's `searxng-service` entry for the full story.
  # `docker/searxng/settings.yml.example` is the committed template (JSON format, needed by
  # mcp-searxng); copy it to `settings.yml` (gitignored, holds a real generated secret_key — see
  # docs/SETUP.md Phase 1) before first deploy.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - pebble-agent-internal
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Bridges the stdio obsidian-mcp server to an SSE endpoint n8n can call.
  #
  # VALIDATED (spike-mcp-bridge): built and tested against a real vault mirror + the real n8n container.
  # Uses the real `sparfenyuk/mcp-proxy` (Python) — NOT `npx -y mcp-proxy`, which resolves to an
  # unrelated npm package (see docs/TROUBLESHOOTING.md). The vault path needs a pre-existing (empty is
  # fine) `.obsidian/` directory, since Journal Sync doesn't replicate it — not yet automated here.
  mcp-obsidian:
    build: ./mcp-obsidian
    container_name: mcp-obsidian
    restart: unless-stopped
    networks:
      - n8n_internal
    volumes:
      - ${VAULT_MIRROR_PATH:-./vault-mirror-vault}:/vault
    ports:
      - "8801:8801"

  # Bridges the stdio mcp-searxng server to an SSE endpoint n8n can call.
  #
  # VALIDATED (spike-mcp-bridge): built and tested end-to-end (real live search results returned).
  # mcp-searxng is installed from git source, not PyPI (PyPI 0.1.0 is incompatible with current
  # SearXNG's JSON schema — see docs/TROUBLESHOOTING.md).
  mcp-searxng:
    build: ./mcp-searxng
    container_name: mcp-searxng
    restart: unless-stopped
    env_file: .env
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    networks:
      - n8n_internal
      - pebble-agent-internal
    depends_on:
      - searxng
    ports:
      - "8802:8802"

networks:
  # n8n's own existing network — external because this project doesn't own/manage n8n's compose stack.
  # `name` is set from N8N_NETWORK_NAME (docker/.env) since every n8n install names this differently;
  # find yours with `docker network ls` or `docker inspect <your-n8n-container> --format
  # '{{json .NetworkSettings.Networks}}'`.
  n8n_internal:
    external: true
    name: ${N8N_NETWORK_NAME}
  # Dedicated to this project: keeps `searxng` reachable only by `mcp-searxng`, not by n8n or the host.
  # external because docs/SETUP.md Phase 1 already creates it (`docker network create
  # pebble-agent-internal`) as a plain, unprefixed network name — without `external: true` here, Compose
  # instead creates and uses its own `<project-name>_pebble-agent-internal` (e.g. `docker_...` when this
  # compose file lives in a directory named `docker`), silently diverging from the network Phase 1 set
  # up and from every other doc/comment in this repo that references `pebble-agent-internal` by name.
  pebble-agent-internal:
    external: true
