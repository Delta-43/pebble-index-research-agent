<svg viewBox="0 0 760 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline diagram: a Pebble Index ring note syncs through MinIO to a headless server, where a shared vault-mirror hub feeds both an n8n Local File Trigger and, via the obsidian-mcp tool, the AI Agent's new research note back into the same vault.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <style>
    .box { fill:#ffffff; stroke:#333333; stroke-width:1.5; }
    .hub { fill:#eaf3ff; stroke:#1a6fc4; stroke-width:2; }
    .boundary { fill:none; stroke:#8a8a8a; stroke-width:1.5; stroke-dasharray:6 4; }
    .title { font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; font-size:14px; fill:#1a1a1a; text-anchor:middle; font-weight:600; }
    .sub { font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; font-size:11px; fill:#555555; text-anchor:middle; }
    .lbl { font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; font-size:11.5px; fill:#3a3a3a; text-anchor:middle; }
    .lbl-l { font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; font-size:11.5px; fill:#3a3a3a; text-anchor:start; }
    .boundary-label { font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; font-size:12px; fill:#6a6a6a; font-weight:600; }
    .edge { stroke:#333333; stroke-width:1.5; fill:none; }
  </style>

  <!-- Server boundary -->
  <rect class="boundary" x="20" y="356" width="720" height="642" rx="10"/>
  <text class="boundary-label" x="40" y="380">headless server (Docker Compose, self-hosted)</text>

  <!-- 1. Ring -->
  <rect class="box" x="270" y="20" width="220" height="54" rx="8"/>
  <text class="title" x="380" y="42">Pebble Index 01 ring</text>
  <text class="sub" x="380" y="60">records a voice note</text>

  <line class="edge" x1="380" y1="74" x2="380" y2="102" marker-end="url(#arrow)"/>
  <text class="lbl" x="440" y="92">records</text>

  <!-- 2. Pebble App (phone) -->
  <rect class="box" x="270" y="102" width="220" height="54" rx="8"/>
  <text class="title" x="380" y="124">Pebble mobile app</text>
  <text class="sub" x="380" y="142">transcribes speech to text</text>

  <line class="edge" x1="380" y1="156" x2="380" y2="184" marker-end="url(#arrow)"/>
  <text class="lbl" x="470" y="174">saves note</text>

  <!-- 3. Obsidian Vault (phone) -->
  <rect class="box" x="270" y="184" width="220" height="54" rx="8"/>
  <text class="title" x="380" y="206">Obsidian vault (phone)</text>
  <text class="sub" x="380" y="224">Index Inbox/&lt;note&gt;.md</text>

  <line class="edge" x1="380" y1="238" x2="380" y2="278" marker-end="url(#arrow)"/>
  <text class="lbl" x="380" y="262">Self-hosted LiveSync (E2EE, Journal Sync)</text>

  <!-- 4. MinIO -->
  <rect class="box" x="270" y="278" width="220" height="54" rx="8"/>
  <text class="title" x="380" y="300">MinIO bucket</text>
  <text class="sub" x="380" y="318">S3-compatible, encrypted at rest</text>

  <line class="edge" x1="380" y1="332" x2="380" y2="392" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="490" y="366">livesync-cli daemon syncs (~2s)</text>

  <!-- 5. livesync-cli -->
  <rect class="box" x="270" y="392" width="220" height="54" rx="8"/>
  <text class="title" x="380" y="414">livesync-cli</text>
  <text class="sub" x="380" y="432">decrypts &amp; materializes journal</text>

  <line class="edge" x1="380" y1="446" x2="380" y2="486" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="480" y="470">mirrors to plain .md files</text>

  <!-- 6. Vault Mirror (hub) -->
  <rect class="hub" x="270" y="486" width="220" height="64" rx="8"/>
  <text class="title" x="380" y="508">Vault mirror (disk)</text>
  <text class="sub" x="380" y="524">Index Inbox/ &#183; Research/</text>
  <text class="sub" x="380" y="538">shared by every tool below</text>

  <line class="edge" x1="380" y1="550" x2="380" y2="600" marker-end="url(#arrow)"/>
  <text class="lbl" x="510" y="578">watches Index Inbox/ for a new file</text>

  <!-- 7. n8n Local File Trigger -->
  <rect class="box" x="270" y="600" width="220" height="54" rx="8"/>
  <text class="title" x="380" y="622">n8n: Local File Trigger</text>
  <text class="sub" x="380" y="640">fires on file add</text>

  <line class="edge" x1="380" y1="654" x2="380" y2="694" marker-end="url(#arrow)"/>
  <text class="lbl" x="470" y="678">note path + transcript text</text>

  <!-- 8. n8n AI Agent -->
  <rect class="box" x="270" y="694" width="220" height="60" rx="8"/>
  <text class="title" x="380" y="718">n8n: AI Agent</text>
  <text class="sub" x="380" y="736">OpenRouter &#183; any model, one key</text>

  <!-- branch to obsidian-mcp -->
  <line class="edge" x1="330" y1="754" x2="150" y2="824" marker-end="url(#arrow)"/>
  <text class="lbl" x="200" y="790" transform="rotate(-33 200 790)">tool: read / create / edit note</text>

  <!-- branch to mcp-searxng -->
  <line class="edge" x1="430" y1="754" x2="610" y2="824" marker-end="url(#arrow)"/>
  <text class="lbl" x="560" y="790" transform="rotate(33 560 790)">tool: search</text>

  <!-- 9. MCP obsidian-mcp -->
  <rect class="box" x="40" y="824" width="220" height="54" rx="8"/>
  <text class="title" x="150" y="846">MCP: obsidian-mcp</text>
  <text class="sub" x="150" y="864">operates on the vault mirror</text>

  <!-- obsidian-mcp back to hub -->
  <path class="edge" d="M150,824 L150,518 L268,518" marker-end="url(#arrow)"/>
  <text class="lbl-l" x="45" y="670" transform="rotate(-90 45 670)">writes Research/ note + backlink</text>

  <!-- 10. MCP mcp-searxng -->
  <rect class="box" x="500" y="824" width="220" height="54" rx="8"/>
  <text class="title" x="610" y="846">MCP: mcp-searxng</text>
  <text class="sub" x="610" y="864">bridges to SearXNG</text>

  <line class="edge" x1="610" y1="878" x2="610" y2="918" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="700" y="900">query / results</text>

  <!-- 11. SearXNG -->
  <rect class="box" x="520" y="918" width="180" height="50" rx="8"/>
  <text class="title" x="610" y="940">SearXNG</text>
  <text class="sub" x="610" y="956">self-hosted meta-search</text>

  <text class="boundary-label" x="40" y="985">no exposed ports &#183; no auth needed &#183; internal Docker network only</text>
</svg>
